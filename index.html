<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ODA Football</title>
    <meta name="description" content="ODA Football - football fixtures, team stats, standings, players and news." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app-shell">
      <header class="site-header">
        <div class="brand-group">
          <div class="logo-mark">O</div>
          <div>
            <div class="brand-name">ODA FOOTBALL</div>
            <div class="brand-tag">Hub & League</div>
          </div>
        </div>

        <nav class="main-nav" aria-label="Main navigation">
          <a href="#/home">Home</a>
          <a href="#/matches">Matches</a>
          <a href="#/results">Results</a>
          <a href="#/teams">Teams</a>
          <a href="#/players">Players</a>
          <a href="#/standings">Standings</a>
          <a href="#/statistics">Statistics</a>
          <a href="#/news">News</a>
          <a href="#/admin" class="admin-link">Admin</a>
        </nav>

        <div class="header-tools">
          <label class="search-wrap" aria-label="Global search">
            <span>⌕</span>
            <input id="globalSearch" type="search" placeholder="Search teams, players, fixtures..." />
          </label>
        </div>
      </header>

      <div id="searchResults" class="search-results hidden" aria-live="polite"></div>

      <main id="pageRoot" class="page-root"></main>

      <footer class="site-footer">
        <div class="footer-grid">
          <div>
            <div class="brand-name footer-brand">ODA FOOTBALL</div>
            <p>Built for communities, clubs, and matchday excitement.</p>
          </div>
          <div>
            <h4>Explore</h4>
            <ul>
              <li><a href="#/matches">Matches</a></li>
              <li><a href="#/teams">Teams</a></li>
              <li><a href="#/standings">Standings</a></li>
            </ul>
          </div>
          <div>
            <h4>Info</h4>
            <ul>
              <li><a href="#/news">News</a></li>
              <li><a href="#/statistics">Statistics</a></li>
              <li><a href="#/admin">Admin</a></li>
            </ul>
          </div>
        </div>
        <div class="footer-bottom">© 2026 ODA Football. All rights reserved.</div>
      </footer>
    </div>

    <div id="toast" class="toast hidden" aria-live="assertive"></div>
    <div id="modalRoot"></div>

    <script src="script.js"></script>
  </body>
</html>
